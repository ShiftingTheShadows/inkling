name: Linux desktop build

# Builds the Electron app (AppImage, .deb, .tar.gz). Run it by hand from the
# Actions tab, or push a tag like v0.1.0 to also publish a GitHub Release.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write   # needed to attach files to a release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install web build deps
        run: npm install --no-audit --no-fund
      - name: Install desktop deps
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Test local server
        working-directory: desktop
        run: npm test
      - name: Build packages
        working-directory: desktop
        run: npm run dist
      - name: Check the packaged API is on disk
        working-directory: desktop
        # The api/ modules are asarUnpack'd because Electron's ESM loader cannot
        # import from inside app.asar; if they stay in the archive the packaged
        # app answers every /api/* request with an error.
        run: |
          for f in search anthropic imgupload; do
            test -f "release/linux-unpacked/resources/app.asar.unpacked/web/api/$f.js" || {
              echo "missing app.asar.unpacked/web/api/$f.js" >&2; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: inkling-linux
          path: |
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.tar.gz
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.tar.gz
